<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>c-major-project</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="stage" aria-labelledby="current-topic">
        <header class="topbar">
          <div class="brand">
            <span class="live-dot" aria-hidden="true"></span>
            <span>LIVE</span>
          </div>
          <div class="session-meta">
            <span id="topic-count">1 / 4</span>
            <span id="mic-state">待機中</span>
          </div>
        </header>

        <div class="topic-card">
          <p class="eyebrow">今日の大テーマ</p>
          <h1 id="current-topic">人生で一番時間を溶かしたものは？</h1>
          <p id="topic-hint">きっかけ、ハマった理由、誰にも伝わらないこだわりまで、思いついた順で話してみてください。</p>
        </div>

        <div class="transcript-panel" aria-live="polite">
          <div class="transcript-heading">
            <span>あなたの発話</span>
            <span id="char-counter">0 / 100</span>
          </div>
          <p id="live-transcript" class="live-transcript">スタートすると、話した言葉がここに溜まります。</p>
        </div>

        <div class="input-deck">
          <div class="progress-wrap" aria-label="文字数プログレス">
            <div id="progress-fill" class="progress-fill"></div>
            <div id="char-bubbles" class="char-bubbles" aria-hidden="true"></div>
          </div>
          <div class="controls">
            <button id="start-button" class="primary-button" type="button">
              <span class="button-icon" aria-hidden="true">●</span>
              診断スタート
            </button>
            <button id="skip-button" class="ghost-button" type="button" disabled>次のテーマへ</button>
          </div>
          <label class="fallback-input">
            <span>音声が使えないとき</span>
            <textarea id="manual-input" rows="2" placeholder="ここに入力しても診断を進められます。" disabled></textarea>
          </label>
        </div>

        <div id="reaction-pop" class="reaction-pop" aria-hidden="true"></div>
      </section>

      <aside class="chat-pane" aria-label="ガヤチャット">
        <div class="chat-header">
          <span>深掘りチャット</span>
          <span id="chat-status">streaming soon</span>
        </div>
        <div id="chat-feed" class="chat-feed"></div>
      </aside>

      <section id="result-view" class="result-view" hidden>
        <div class="result-inner">
          <div class="result-hero">
            <div class="result-copy">
              <p class="eyebrow">診断結果</p>
              <h2 id="result-title">あなたの未来タイプ</h2>
              <p id="result-summary"></p>
            </div>
            <figure class="result-figure">
              <img id="result-image" alt="診断結果の3Dフィギュア風ビジュアル">
            </figure>
          </div>
          <div class="result-grid">
            <article>
              <h3>よく出たキーワード</h3>
              <div id="keyword-list" class="keyword-list"></div>
            </article>
            <article>
              <h3>近い仕事の方向性</h3>
              <ul id="job-list"></ul>
            </article>
          </div>
          <button id="restart-button" class="primary-button" type="button">もう一度診断する</button>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
